{% extends "base.html" %}{% block head %}<link rel="stylesheet" href="/ui/static/easymde.min.css">
<style>.files{display:grid;grid-template-columns:minmax(12rem,1fr) 3fr;gap:1.5rem}.tree{list-style:none;padding:0;font-size:14px;overflow-wrap:anywhere}
.current{font-weight:600}.path{width:100%;box-sizing:border-box}@media(max-width:700px){.files{grid-template-columns:1fr}}
@media(prefers-color-scheme:dark){.EasyMDEContainer .CodeMirror{background:#222;color:#eee;border-color:#555}.EasyMDEContainer .CodeMirror-cursor{border-color:#eee}}</style>{% endblock %}
{% block content %}<div class="files"><ul class="tree">{% for f in tree %}<li><a class="{{ 'current' if f == path }}" href="/ui/files?path={{ f|urlencode }}">{{ f }}</a></li>{% endfor %}</ul>
<form method="post">{% if message %}<p class="ok">{{ message }}</p>{% endif %}
<label>Path <input class="path" name="path" value="{{ path or '' }}" required placeholder="docs/new-note.md"></label>
<input type="hidden" name="hash" value="{{ hash }}"><textarea id="editor" name="content">{{ content }}</textarea>
{% if path and path.startswith("core/") %}<label><input type="checkbox" name="confirm_core" value="yes"> core/ loads into every session; save it anyway</label>{% endif %}
<button>Save</button></form></div><script src="/ui/static/easymde.min.js"></script>
<script>new EasyMDE({element:document.getElementById('editor'),autoDownloadFontAwesome:false,toolbar:false,spellChecker:false,status:false,forceSync:true});</script>{% endblock %}
