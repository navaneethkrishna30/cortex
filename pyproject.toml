[project]
name = "cortex"
version = "0.4.0"
description = "Local-first memory layer for AI agents: markdown notes, a SQLite index, one MCP server"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Navaneeth Krishna" }
]
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "markdown-it-py>=4.2.0",
    "mcp>=1.12",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "pyotp>=2.10.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "segno>=1.6.6",
    "sqlite-vec>=0.1.9",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
    "watchdog>=6.0.0",
]

[project.optional-dependencies]
local = ["fastembed>=0.9.1"]

[project.scripts]
cortex = "cortex.cli:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, blind excepts, simplify, ruff's own.
select = ["E", "F", "W", "I", "B", "UP", "BLE", "SIM", "RUF"]
# The formatter owns line length; what it can't wrap (long strings, docstrings) stays readable as is.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests name one-line actions as lambdas and unpack whole results to show their shape.
"tests/*" = ["E731", "RUF059"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
# A langsmith pytest plugin installed globally breaks collection; Cortex never uses it.
addopts = "-q -p no:langsmith"
