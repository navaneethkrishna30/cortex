<div class="editor-head"><div class="editor-title"><a class="back-link" href="/ui/files?path={{ path|urlencode }}">← Note</a><h1>{{ path }}</h1></div><div class="actions"><a class="btn sm" href="/ui/files?path={{ path|urlencode }}">Back to note</a></div></div>
<div class="overview"><h2>Changes</h2>{% if history %}<ul class="list">{% for c in history %}<li><div class="list-row"><span>{{ c.action }}</span><span class="muted" title="{{ c.at|when }}">{{ c.actor }} · {{ c.at|ago }}</span></div></li>{% endfor %}</ul>{% else %}<p class="muted">No changes logged yet.</p>{% endif %}<p class="small muted">Old versions aren't kept here; restore one from your vault backup.</p></div>
